name: Team Jura Atlas - manual licensed data review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-only:
    if: github.ref_name == 'development'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mirror GTADB.org CC BY 4.0 IV and V research landmarks
        run: python scripts/sync_atlas98_gtadb.py --output data
      - name: Test generated source metadata and shape
        run: |
          python -m unittest discover -s tests -p 'test_atlas98b_sync.py'
          python - <<'PY'
          import json
          from pathlib import Path
          for g in ('4','5'):
              data=json.loads((Path('data')/f'gtadb-{g}.json').read_text())
              assert data['license']=='CC BY 4.0'
              assert isinstance(data['records'],dict) and len(data['records'])>0
              print(g,'landmarks',data['count'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtadb-attributed-iv-v-datasets-review-before-commit
          path: |
            data/gtadb-4.json
            data/gtadb-4-manifest.json
            data/gtadb-5.json
            data/gtadb-5-manifest.json
          if-no-files-found: error
          retention-days: 30
